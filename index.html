<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volleyball Coach Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #B0FA9F; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const state = {
      tool: 'move',
      players: [],
      ball: null,
      drawings: [],
      arrows: [],
      areas: [],
      court: null,
      dragging: null,
      playersInitialized: false,
    };

    function initPlayers() {
      if (state.playersInitialized) return;
      state.playersInitialized = true;

      const court = state.court;
      const r = 40;
      const gap = 10;
      const colX1 = court.x - r * 2 - gap - r * 2 - gap;
      const colX2 = colX1 + r * 2 + gap;
      const startY = court.y + r;

      // Ball — above MB1
      state.ball = {
        x: colX1,
        y: startY,
        radius: 20,
      };

      const row1Y = startY + 20 + gap + r; // MB1
      const row2Y = row1Y + r * 2 + gap;    // MB2
      const row3Y = row2Y + r * 2 + gap;    // OH1, OP
      const row4Y = row3Y + r * 2 + gap;    // OH2, S
      const lY = row4Y + r * 2 + gap + r;   // L centered below

      state.players = [
        { label: 'MB1', x: colX1, y: row1Y, radius: r, color: '#2A57D4', textColor: '#FFFFFF' },
        { label: 'MB2', x: colX1, y: row2Y, radius: r, color: '#2A57D4', textColor: '#FFFFFF' },
        { label: 'OH1', x: colX1, y: row3Y, radius: r, color: '#AF2AD4', textColor: '#FFFFFF' },
        { label: 'OH2', x: colX1, y: row4Y, radius: r, color: '#AF2AD4', textColor: '#FFFFFF' },
        { label: 'OP',  x: colX2, y: row3Y, radius: r, color: '#2AD443', textColor: '#FFFFFF' },
        { label: 'S',   x: colX2, y: row4Y, radius: r, color: '#001A00', textColor: '#FFFFFF' },
        { label: 'L',   x: colX1 + (colX2 - colX1) / 2, y: lY, radius: r, color: '#FFFFFF', textColor: '#000A00' },
      ];
    }

    function drawPlayers() {
      state.players.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = p.textColor;
        ctx.font = `bold ${Math.round(p.radius * 0.7)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.label, p.x, p.y);
      });
    }

    function drawBall() {
      const b = state.ball;
      if (!b) return;
      const r = b.radius;

      // White circle with blue stroke
      ctx.beginPath();
      ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
      ctx.fillStyle = '#FFFFFF';
      ctx.fill();
      ctx.strokeStyle = '#162DDA';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Volleyball curved lines
      ctx.strokeStyle = '#162DDA';
      ctx.lineWidth = 1.5;

      // Horizontal curve
      ctx.beginPath();
      ctx.moveTo(b.x - r, b.y);
      ctx.quadraticCurveTo(b.x, b.y - r * 0.35, b.x + r, b.y);
      ctx.stroke();

      // Left curve
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - r);
      ctx.quadraticCurveTo(b.x - r * 0.35, b.y, b.x, b.y + r);
      ctx.stroke();

      // Right curve
      ctx.beginPath();
      ctx.moveTo(b.x, b.y - r);
      ctx.quadraticCurveTo(b.x + r * 0.35, b.y, b.x, b.y + r);
      ctx.stroke();
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderAll();
    }

    function drawCourt() {
      const courtW = canvas.width * 0.5;
      const courtH = canvas.height * 0.85;
      const courtX = (canvas.width - courtW) / 2;
      const courtY = (canvas.height - courtH) / 2;

      state.court = { x: courtX, y: courtY, w: courtW, h: courtH };

      // Full court — yellow
      ctx.fillStyle = '#F6FE5C';
      ctx.fillRect(courtX, courtY, courtW, courtH);

      // Opponent's side (top half) — darker yellow
      ctx.fillStyle = '#B4BC22';
      ctx.fillRect(courtX, courtY, courtW, courtH / 2);

      // Top end line — dark green
      const lineThickness = 3;
      ctx.fillStyle = '#003400';
      ctx.fillRect(courtX, courtY, courtW, lineThickness);

      // Net line — blue, middle of court
      ctx.fillStyle = '#2A57D4';
      ctx.fillRect(courtX, courtY + courtH / 2 - lineThickness / 2, courtW, lineThickness);

      // Zone numbers
      const halfH = courtH / 2;
      const colW = courtW / 3;

      ctx.font = `bold ${Math.round(courtH * 0.12)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';

      // Top row (opponent side): 4, 3, 2
      const topRowY = courtY + halfH * 0.5;
      ctx.fillText('4', courtX + colW * 0.5, topRowY);
      ctx.fillText('3', courtX + colW * 1.5, topRowY);
      ctx.fillText('2', courtX + colW * 2.5, topRowY);

      // Bottom row (our side): 5, 6, 1
      const botRowY = courtY + halfH + halfH * 0.5;
      ctx.fillText('5', courtX + colW * 0.5, botRowY);
      ctx.fillText('6', courtX + colW * 1.5, botRowY);
      ctx.fillText('1', courtX + colW * 2.5, botRowY);
    }

    // --- Toolbar icon drawing functions ---

    function drawMoveIcon(x, y, size) {
      const cx = x + size / 2;
      const cy = y + size / 2;
      const arm = size * 0.38;
      const head = size * 0.12;

      ctx.strokeStyle = '#333';
      ctx.fillStyle = '#333';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      // Cross lines
      ctx.beginPath();
      ctx.moveTo(cx - arm, cy); ctx.lineTo(cx + arm, cy);
      ctx.moveTo(cx, cy - arm); ctx.lineTo(cx, cy + arm);
      ctx.stroke();

      // Arrow heads — right
      ctx.beginPath();
      ctx.moveTo(cx + arm, cy);
      ctx.lineTo(cx + arm - head, cy - head);
      ctx.lineTo(cx + arm - head, cy + head);
      ctx.closePath(); ctx.fill();
      // left
      ctx.beginPath();
      ctx.moveTo(cx - arm, cy);
      ctx.lineTo(cx - arm + head, cy - head);
      ctx.lineTo(cx - arm + head, cy + head);
      ctx.closePath(); ctx.fill();
      // up
      ctx.beginPath();
      ctx.moveTo(cx, cy - arm);
      ctx.lineTo(cx - head, cy - arm + head);
      ctx.lineTo(cx + head, cy - arm + head);
      ctx.closePath(); ctx.fill();
      // down
      ctx.beginPath();
      ctx.moveTo(cx, cy + arm);
      ctx.lineTo(cx - head, cy + arm - head);
      ctx.lineTo(cx + head, cy + arm - head);
      ctx.closePath(); ctx.fill();
    }

    function drawDrawIcon(x, y, size) {
      ctx.strokeStyle = '#333';
      ctx.fillStyle = '#333';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const px = x + size * 0.2;
      const py = y + size * 0.8;
      const tx = x + size * 0.8;
      const ty = y + size * 0.2;

      // Pencil body
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      // Pencil tip
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + size * 0.08, py - size * 0.12);
      ctx.lineTo(px + size * 0.12, py - size * 0.08);
      ctx.closePath();
      ctx.fill();

      // Pencil top
      ctx.beginPath();
      ctx.moveTo(tx - size * 0.06, ty + size * 0.1);
      ctx.lineTo(tx, ty);
      ctx.lineTo(tx + size * 0.04, ty + size * 0.1);
      ctx.stroke();
    }

    function drawArrowIcon(x, y, size) {
      ctx.strokeStyle = '#333';
      ctx.fillStyle = '#333';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';

      const cy = y + size / 2;
      const left = x + size * 0.18;
      const right = x + size * 0.82;
      const head = size * 0.2;

      // Shaft
      ctx.beginPath();
      ctx.moveTo(right, cy);
      ctx.lineTo(left, cy);
      ctx.stroke();

      // Arrow head pointing left
      ctx.beginPath();
      ctx.moveTo(left, cy);
      ctx.lineTo(left + head, cy - head);
      ctx.lineTo(left + head, cy + head);
      ctx.closePath();
      ctx.fill();
    }

    function drawAreaIcon(x, y, size) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const pad = size * 0.15;
      const rectW = size * 0.55;
      const rectH = size * 0.45;

      // Back rect
      ctx.strokeRect(x + pad + size * 0.15, y + pad, rectW, rectH);
      // Front rect (overlapping)
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.fillRect(x + pad, y + pad + size * 0.2, rectW, rectH);
      ctx.strokeStyle = '#333';
      ctx.strokeRect(x + pad, y + pad + size * 0.2, rectW, rectH);
    }

    function drawClearIcon(x, y, size) {
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const cx = x + size / 2;
      const cy = y + size / 2;
      const r = size * 0.32;

      // Diamond / eraser shape
      ctx.beginPath();
      ctx.moveTo(cx, cy - r);
      ctx.lineTo(cx + r, cy);
      ctx.lineTo(cx, cy + r);
      ctx.lineTo(cx - r, cy);
      ctx.closePath();
      ctx.stroke();

      // X inside
      const inner = r * 0.45;
      ctx.beginPath();
      ctx.moveTo(cx - inner, cy - inner);
      ctx.lineTo(cx + inner, cy + inner);
      ctx.moveTo(cx + inner, cy - inner);
      ctx.lineTo(cx - inner, cy + inner);
      ctx.stroke();
    }

    // --- Toolbar ---

    function drawToolbar() {
      const tbW = 60;
      const tbH = 280;
      const tbX = canvas.width - 30 - tbW;
      const tbY = (canvas.height - tbH) / 2;
      const borderRadius = 25;

      state.toolbarBounds = { x: tbX, y: tbY, w: tbW, h: tbH };

      // White rounded rect
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.roundRect(tbX, tbY, tbW, tbH, borderRadius);
      ctx.fill();

      // Buttons
      const tools = ['move', 'draw', 'arrow', 'area', 'clear'];
      const btnSize = 40;
      const totalBtnH = tools.length * btnSize;
      const gap = (tbH - totalBtnH) / (tools.length + 1);

      const iconDrawers = {
        move: drawMoveIcon,
        draw: drawDrawIcon,
        arrow: drawArrowIcon,
        area: drawAreaIcon,
        clear: drawClearIcon,
      };

      state.toolButtons = [];

      tools.forEach((tool, i) => {
        const bx = tbX + (tbW - btnSize) / 2;
        const by = tbY + gap + i * (btnSize + gap);

        state.toolButtons.push({ tool, x: bx, y: by, w: btnSize, h: btnSize });

        // Active highlight
        if (state.tool === tool) {
          ctx.fillStyle = 'rgba(0,0,0,0.1)';
          ctx.beginPath();
          ctx.roundRect(bx, by, btnSize, btnSize, 8);
          ctx.fill();
        }

        iconDrawers[tool](bx, by, btnSize);
      });
    }

    // --- Hit-test helpers ---

    function hitTestCircle(mx, my, cx, cy, r) {
      return (mx - cx) ** 2 + (my - cy) ** 2 <= r * r;
    }

    function hitTestRect(mx, my, rx, ry, rw, rh) {
      return mx >= rx && mx <= rx + rw && my >= ry && my <= ry + rh;
    }

    // --- Draw tool (freehand) ---

    function drawStroke(stroke) {
      if (stroke.points.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke.points[0].x, stroke.points[0].y);
      for (let i = 1; i < stroke.points.length; i++) {
        ctx.lineTo(stroke.points[i].x, stroke.points[i].y);
      }
      ctx.strokeStyle = stroke.color;
      ctx.lineWidth = stroke.width;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    function drawAllStrokes() {
      state.drawings.forEach(drawStroke);
    }

    function startDraw(pos) {
      state.currentDrawing = { points: [pos], color: '#003400', width: 3 };
    }

    function doDraw(pos) {
      if (!state.currentDrawing) return;
      state.currentDrawing.points.push(pos);
      renderAll();
      drawStroke(state.currentDrawing);
    }

    function endDraw() {
      if (state.currentDrawing && state.currentDrawing.points.length > 1) {
        state.drawings.push(state.currentDrawing);
      }
      state.currentDrawing = null;
      renderAll();
    }

    // --- Arrow tool ---

    function drawArrowShape(arrow) {
      const dx = arrow.toX - arrow.fromX;
      const dy = arrow.toY - arrow.fromY;
      const angle = Math.atan2(dy, dx);
      const headLen = 15;

      ctx.strokeStyle = '#003400';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';

      // Shaft
      ctx.beginPath();
      ctx.moveTo(arrow.fromX, arrow.fromY);
      ctx.lineTo(arrow.toX, arrow.toY);
      ctx.stroke();

      // Arrowhead
      ctx.fillStyle = '#003400';
      ctx.beginPath();
      ctx.moveTo(arrow.toX, arrow.toY);
      ctx.lineTo(arrow.toX - headLen * Math.cos(angle - Math.PI / 6), arrow.toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(arrow.toX - headLen * Math.cos(angle + Math.PI / 6), arrow.toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fill();
    }

    function drawAllArrows() {
      state.arrows.forEach(drawArrowShape);
    }

    function startArrow(pos) {
      state.currentArrow = { fromX: pos.x, fromY: pos.y, toX: pos.x, toY: pos.y };
    }

    function doArrow(pos) {
      if (!state.currentArrow) return;
      state.currentArrow.toX = pos.x;
      state.currentArrow.toY = pos.y;
      renderAll();
      drawArrowShape(state.currentArrow);
    }

    function endArrow(pos) {
      if (state.currentArrow) {
        const dx = state.currentArrow.toX - state.currentArrow.fromX;
        const dy = state.currentArrow.toY - state.currentArrow.fromY;
        if (Math.sqrt(dx * dx + dy * dy) > 10) {
          state.arrows.push(state.currentArrow);
        }
      }
      state.currentArrow = null;
      renderAll();
    }

    // --- Area tool (polygon) ---

    function drawPolygon(area, isPreview) {
      if (!area.points || area.points.length === 0) return;

      ctx.fillStyle = 'rgba(255,100,100,0.2)';
      ctx.strokeStyle = 'rgba(255,0,0,0.7)';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(area.points[0].x, area.points[0].y);
      for (let i = 1; i < area.points.length; i++) {
        ctx.lineTo(area.points[i].x, area.points[i].y);
      }
      if (!isPreview) {
        ctx.closePath();
      }
      ctx.fill();
      ctx.stroke();

      // Red dots at vertices
      area.points.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,0,0,0.7)';
        ctx.fill();
      });
    }

    function drawAreaPreview(area) {
      if (!area) return;
      if (area.points.length === 1) {
        ctx.beginPath();
        ctx.arc(area.points[0].x, area.points[0].y, 4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,0,0,0.7)';
        ctx.fill();
      } else {
        drawPolygon(area, true);
      }
    }

    function drawAllAreas() {
      state.areas.forEach(a => drawPolygon(a, false));
    }

    function addAreaPoint(pos) {
      if (!state.currentArea) {
        state.currentArea = { points: [pos] };
      } else {
        state.currentArea.points.push(pos);
      }
      renderAll();
      drawAreaPreview(state.currentArea);
    }

    // --- Move tool ---

    function startMove(pos) {
      // Check ball first
      const b = state.ball;
      if (b && hitTestCircle(pos.x, pos.y, b.x, b.y, b.radius)) {
        state.dragging = b;
        state.dragOffset = { x: pos.x - b.x, y: pos.y - b.y };
        return;
      }
      // Check players in reverse order
      for (let i = state.players.length - 1; i >= 0; i--) {
        const p = state.players[i];
        if (hitTestCircle(pos.x, pos.y, p.x, p.y, p.radius)) {
          state.dragging = p;
          state.dragOffset = { x: pos.x - p.x, y: pos.y - p.y };
          return;
        }
      }
    }

    function doMove(pos) {
      if (!state.dragging) return;
      state.dragging.x = pos.x - state.dragOffset.x;
      state.dragging.y = pos.y - state.dragOffset.y;
      renderAll();
    }

    function endMove() {
      state.dragging = null;
      state.dragOffset = null;
    }

    // --- Cursor management ---

    function updateCursor(pos) {
      const tb = state.toolbarBounds;
      if (tb && hitTestRect(pos.x, pos.y, tb.x, tb.y, tb.w, tb.h)) {
        canvas.style.cursor = 'pointer';
        return;
      }

      if (state.tool === 'move') {
        if (state.dragging) {
          canvas.style.cursor = 'grabbing';
          return;
        }
        const b = state.ball;
        if (b && hitTestCircle(pos.x, pos.y, b.x, b.y, b.radius)) {
          canvas.style.cursor = 'grab';
          return;
        }
        for (let i = state.players.length - 1; i >= 0; i--) {
          const p = state.players[i];
          if (hitTestCircle(pos.x, pos.y, p.x, p.y, p.radius)) {
            canvas.style.cursor = 'grab';
            return;
          }
        }
        canvas.style.cursor = 'default';
      } else if (state.tool === 'draw' || state.tool === 'arrow' || state.tool === 'area') {
        canvas.style.cursor = 'crosshair';
      } else {
        canvas.style.cursor = 'default';
      }
    }

    // --- Cancel in-progress operations ---

    function cancelInProgress() {
      state.currentDrawing = null;
      state.currentArrow = null;
      state.currentArea = null;
      state.dragging = null;
      state.dragOffset = null;
    }

    // --- Clear all drawings/arrows/areas ---

    function clearAll() {
      if (confirm('Clear all drawings, arrows, and areas?')) {
        state.drawings = [];
        state.arrows = [];
        state.areas = [];
        state.currentDrawing = null;
        state.currentArrow = null;
        state.currentArea = null;
        renderAll();
      }
    }

    // --- Mouse event handlers ---

    function getMousePos(e) {
      return { x: e.clientX, y: e.clientY };
    }

    canvas.addEventListener('mousedown', function(e) {
      const pos = getMousePos(e);

      // Check toolbar buttons first
      if (state.toolButtons) {
        for (const btn of state.toolButtons) {
          if (hitTestRect(pos.x, pos.y, btn.x, btn.y, btn.w, btn.h)) {
            if (btn.tool === 'clear') {
              clearAll();
            } else {
              cancelInProgress();
              state.tool = btn.tool;
            }
            renderAll();
            return;
          }
        }
      }

      // Tool-specific start
      if (state.tool === 'move') startMove(pos);
      else if (state.tool === 'draw') startDraw(pos);
      else if (state.tool === 'arrow') startArrow(pos);
      else if (state.tool === 'area') addAreaPoint(pos);
    });

    canvas.addEventListener('mousemove', function(e) {
      const pos = getMousePos(e);
      updateCursor(pos);

      if (state.tool === 'move') doMove(pos);
      else if (state.tool === 'draw') doDraw(pos);
      else if (state.tool === 'arrow') doArrow(pos);
    });

    canvas.addEventListener('mouseup', function(e) {
      const pos = getMousePos(e);

      if (state.tool === 'move') endMove();
      else if (state.tool === 'draw') endDraw();
      else if (state.tool === 'arrow') endArrow(pos);
    });

    // Double-click to close area polygon
    canvas.addEventListener('dblclick', function(e) {
      if (state.tool === 'area' && state.currentArea && state.currentArea.points.length >= 3) {
        state.areas.push(state.currentArea);
        state.currentArea = null;
        renderAll();
      }
    });

    // --- Hotkeys ---

    window.addEventListener('keydown', function(e) {
      const key = e.key.toLowerCase();
      if (key === 'v') { cancelInProgress(); state.tool = 'move'; renderAll(); }
      else if (key === 'd') { cancelInProgress(); state.tool = 'draw'; renderAll(); }
      else if (key === 'a') { cancelInProgress(); state.tool = 'arrow'; renderAll(); }
      else if (key === 'p') { cancelInProgress(); state.tool = 'area'; renderAll(); }
      else if (key === 'x') { clearAll(); }
      else if (key === 'escape') { cancelInProgress(); renderAll(); }
    });

    // --- Render ---

    function renderAll() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#B0FA9F';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawCourt();
      initPlayers();
      drawAllStrokes();
      drawAllArrows();
      drawAllAreas();
      drawPlayers();
      drawBall();
      drawToolbar();
    }

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
